<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warga Potrobayan</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
</head>
<body>
  <h1>Aplikasi Warga Potrobayan</h1>
  <button id="btnNotif">Aktifkan Notifikasi</button>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('SW terdaftar!'))
        .catch(err => console.error('Gagal daftar SW:', err));
    }

    // Minta izin Notifikasi
    document.getElementById('btnNotif').addEventListener('click', () => {
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          alert('Izin notifikasi diberikan!');
        } else {
          alert('Izin notifikasi ditolak/diblokir.');
        }
      });
    });
  </script>
</body>
</html>
