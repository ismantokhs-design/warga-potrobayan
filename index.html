<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Template Firebase</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./src/css/style.css">
</head>
<body class="bg-gray-100 flex flex-col h-screen justify-between overflow-hidden">

    <!-- Header / Top Bar -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center z-40">
        <h1 id="page-title" class="font-bold text-lg">Memuat...</h1>
    </header>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-1 overflow-y-auto p-4 mb-16">
        <!-- Konten dari views/ akan dimuat di sini secara otomatis -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg hidden justify-around py-2 z-50">
        <button onclick="switchPage('home', 'Beranda')" class="nav-btn flex flex-col items-center text-gray-500 focus:outline-none" data-target="home">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs mt-1">Beranda</span>
        </button>
        <button onclick="switchPage('gallery', 'Galeri')" class="nav-btn flex flex-col items-center text-gray-500 focus:outline-none" data-target="gallery">
            <i class="fas fa-images text-xl"></i>
            <span class="text-xs mt-1">Galeri</span>
        </button>
        <button onclick="switchPage('profile', 'Profil')" class="nav-btn flex flex-col items-center text-gray-500 focus:outline-none" data-target="profile">
            <i class="fas fa-user text-xl"></i>
            <span class="text-xs mt-1">Profil</span>
        </button>
        <button onclick="switchPage('settings', 'Setting')" class="nav-btn flex flex-col items-center text-gray-500 focus:outline-none" data-target="settings">
            <i class="fas fa-cog text-xl"></i>
            <span class="text-xs mt-1">Setting</span>
        </button>
        <button onclick="switchPage('more', 'More')" class="nav-btn flex flex-col items-center text-gray-500 focus:outline-none" data-target="more">
            <i class="fas fa-ellipsis-h text-xl"></i>
            <span class="text-xs mt-1">More</span>
        </button>
    </nav>

    <!-- Entry Point JavaScript -->
    <script type="module" src="./src/js/app.js"></script>

    <!-- Pendaftaran Service Worker untuk PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker terdaftar:', reg.scope))
                    .catch(err => console.log('Gagal daftar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
