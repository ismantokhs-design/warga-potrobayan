<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masuk - Warga Potrobayan</title>
  
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body class="login-body">

  <div class="login-container">
    <!-- Card Login -->
    <div class="login-card">
      
      <!-- Header / Logo -->
      <div class="login-header">
        <div class="brand-icon-wrapper">
          <span class="brand-icon">🏡</span>
        </div>
        <h2 class="login-title">Warga Potrobayan</h2>
        <p class="login-subtitle">Masuk menggunakan akun yang telah didaftarkan oleh Pengurus/Admin.</p>
      </div>

      <!-- Alert Pesan Error -->
      <div id="login-error" class="login-error hidden"></div>

      <!-- Form Login -->
      <form id="login-form" autocomplete="off">
        
        <!-- Input Email -->
        <div class="input-group">
          <label for="email" class="input-label">Alamat Email</label>
          <div class="input-wrapper">
            <span class="input-icon">📧</span>
            <input 
              type="email" 
              id="email" 
              class="form-control" 
              placeholder="nama@potrobayan.id" 
              required
            >
          </div>
        </div>

        <!-- Input Password dengan Toggle Cek Password -->
        <div class="input-group">
          <label for="password" class="input-label">Kata Sandi</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="••••••••" 
              required
            >
            <button type="button" id="toggle-password" class="btn-toggle-pwd" title="Tampilkan Kata Sandi">
              <svg id="icon-eye-off" class="pwd-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <svg id="icon-eye" class="pwd-svg hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Tombol Submit -->
        <button type="submit" id="btn-submit" class="btn-login">
          <span>Masuk</span>
        </button>

      </form>

      <!-- Footer Info -->
      <div class="login-footer">
        <p>Belum memiliki akun? Silakan hubungi <strong>Pengurus RT/RW</strong> Dusun Potrobayan.</p>
      </div>

    </div>
  </div>

  <!-- Logic Login & Toggle Password -->
  <script type="module">
    import { loginUser } from '../assets/js/firebase.js';

    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const iconEye = document.getElementById('icon-eye');
      const iconEyeOff = document.getElementById('icon-eye-off');
      const errorBox = document.getElementById('login-error');
      const btnSubmit = document.getElementById('btn-submit');

      // 1. Fitur Toggle Cek Password (Show/Hide)
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        iconEye.classList.toggle('hidden', !isPassword);
        iconEyeOff.classList.toggle('hidden', isPassword);
      });

      // 2. Fitur Submit Login
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.add('hidden');
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span>Memproses...</span>';

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        const result = await loginUser(email, password);

        if (result.success) {
          window.location.replace('../index.html');
        } else {
          errorBox.textContent = 'Email atau kata sandi tidak valid. Silakan periksa kembali.';
          errorBox.classList.remove('hidden');
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<span>Masuk</span>';
        }
      });
    });
  </script>
</body>
</html>
