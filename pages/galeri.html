<!-- Header Galeri -->
<div class="card" style="text-align: center; padding: 15px;">
  <h2 style="font-size: 1.1rem; color: var(--primary-dark);">🖼️ Galeri Kegiatan Warga</h2>
  <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">
    Dokumentasi dan kenangan momen kebersamaan di Dusun Potrobayan
  </p>
</div>

<!-- Filter Kategori Kapsul -->
<div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; -webkit-overflow-scrolling: touch;">
  <button class="btn" style="width: auto; padding: 6px 14px; font-size: 0.8rem; white-space: nowrap;" onclick="filterGaleri('semua')">Semua</button>
  <button class="btn" style="width: auto; padding: 6px 14px; font-size: 0.8rem; background: #e2e8f0; color: var(--text-main); white-space: nowrap;" onclick="filterGaleri('kegiatan')">Kegiatan Warga</button>
  <button class="btn" style="width: auto; padding: 6px 14px; font-size: 0.8rem; background: #e2e8f0; color: var(--text-main); white-space: nowrap;" onclick="filterGaleri('gotongroyong')">Kerja Bakti</button>
  <button class="btn" style="width: auto; padding: 6px 14px; font-size: 0.8rem; background: #e2e8f0; color: var(--text-main); white-space: nowrap;" onclick="filterGaleri('wisata')">Wisata & Alam</button>
</div>

<!-- Grid Foto Galeri -->
<div id="galeri-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">

  <!-- Item Foto 1 -->
  <div class="card" style="padding: 8px; margin-bottom: 0;">
    <div style="width: 100%; height: 120px; background-color: #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 2rem;">
      🏞️
    </div>
    <div style="margin-top: 8px;">
      <h4 style="font-size: 0.85rem; color: var(--text-main);">Lembah Potrobayan</h4>
      <p style="font-size: 0.75rem; color: var(--text-muted);">Suasana sore di tepi sungai</p>
    </div>
  </div>

  <!-- Item Foto 2 -->
  <div class="card" style="padding: 8px; margin-bottom: 0;">
    <div style="width: 100%; height: 120px; background-color: #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 2rem;">
      🧹
    </div>
    <div style="margin-top: 8px;">
      <h4 style="font-size: 0.85rem; color: var(--text-main);">Kerja Bakti RT 02</h4>
      <p style="font-size: 0.75rem; color: var(--text-muted);">Pembersihan jalan desa</p>
    </div>
  </div>

  <!-- Item Foto 3 -->
  <div class="card" style="padding: 8px; margin-bottom: 0;">
    <div style="width: 100%; height: 120px; background-color: #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 2rem;">
      🎉
    </div>
    <div style="margin-top: 8px;">
      <h4 style="font-size: 0.85rem; color: var(--text-main);">Merti Dusun</h4>
      <p style="font-size: 0.75rem; color: var(--text-muted);">Upacara adat dan kebudayaan</p>
    </div>
  </div>

  <!-- Item Foto 4 -->
  <div class="card" style="padding: 8px; margin-bottom: 0;">
